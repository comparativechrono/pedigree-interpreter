[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "PedInterp"
dynamic = ["version"]
authors = [
    { name="Nick Taylor", email="taylorngt@cox.net" },
]
description = "Image interpreter for clinical pedigrees for conversion to PED file formatting"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
        "Programming Language :: Python :: 3",
        "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "pytesseract>=0.3.10",
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "Pillow>=9.0.0",
    "pandas>=1.3.0,<4.0.0",
    "pedigree-ga4gh>=1.0,<2",
]

[project.scripts]
pedinterp = "PedInterp.cli:main"

[project.optional-dependencies]
# studio2ped and studio2ga4gh, the lab's converters from Pedigree Studio, read the drawings Studio_export writes back,
# for the tests that the drawings hold the same family
test = ["pytest", "studio2ped>=0.2", "studio2ga4gh>=0.4"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/PedInterp/_version.py"

[project.urls]
Homepage = "https://github.com/taylorngt/pedigree-interpreter"
Issues = "https://github.com/taylorngt/pedigree-interpreter/issues"